name: Source checks
on:
  push:
    branches: [main]
    paths-ignore:
      - 'qa/**'
      - '*.md'
      - '.runtime/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install reviewed dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q app/backend ops
      - name: Test synthetic account, isolation and recovery flows
        run: python -m unittest discover -s tests -v
